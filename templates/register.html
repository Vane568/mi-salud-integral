{% extends 'base.html' %}{% block title %}Crear cuenta · Mi Salud Integral{% endblock %}{% block content %}
<section class="auth card"><p class="eyebrow">UN ESPACIO PERSONAL Y PRIVADO</p><h1>Crear cuenta</h1><p>Cada persona tendrá su propio perfil y sus registros.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nombre y apellido<input name="name" maxlength="100" required autocomplete="name"></label><label>Correo electrónico<input type="email" name="email" maxlength="180" required autocomplete="email"></label><label>Contraseña (mínimo 10 caracteres)<input type="password" name="password" minlength="10" required autocomplete="new-password"></label><button class="primary">Crear mi cuenta</button></form><p>¿Ya tenés cuenta? <a href="{{ url_for('login') }}">Ingresar</a></p></section>{% endblock %}
